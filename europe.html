<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Europe travel photo gallery with classic cities and coastal escapes." />
  <title>Europe | Yolande's Travel Photos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <h1><a href="index.html" style="color: inherit; text-decoration: none;">Yolande's Travel Photos</a></h1>
      <button class="burger-menu" id="burgerMenu" aria-label="Open navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="north-america.html">North America</a></li>
        <li><a href="asia.html">Asia</a></li>
        <li><a href="europe.html" style="color: white; background-color: rgba(255,255,255,0.08);">Europe</a></li>
        <li><a href="south-america.html">South America</a></li>
        <li><a href="africa.html">Africa</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" style="background: linear-gradient(135deg, rgba(10,10,10,0.8), rgba(16,16,16,0.7)), url('https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;">
      <div class="hero-content">
        <h2>Europe</h2>
        <p>Historic streets and timeless beauty</p>
      </div>
    </section>

    <div class="continent-filter" style="display: none;"></div>

    <div class="editorial-intro">
      <span class="eyebrow">Travel Journal</span>
      <h2>Classic escapes</h2>
    </div>

    <section class="country-section">
      <h3>Italy</h3>

      <div class="location-section">
        <h4>Rome</h4>
        <div class="photo-grid">
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1525874684015-58379d421a52?auto=format&fit=crop&w=900&q=80" alt="Rome architecture" /></div>
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80" alt="Historic streets of Rome" /></div>
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=900&q=80" alt="Italian landscape" /></div>
        </div>
      </div>
    </section>

    <section class="country-section">
      <h3>France</h3>

      <div class="location-section">
        <h4>Paris</h4>
        <div class="photo-grid">
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=900&q=80" alt="Paris city view" /></div>
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=900&q=80" alt="Paris boulevard" /></div>
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1501963422761-c8d7994ef9bf?auto=format&fit=crop&w=900&q=80" alt="French architecture" /></div>
        </div>
      </div>
    </section>

    <section class="country-section">
      <h3>Greece</h3>

      <div class="location-section">
        <h4>Santorini</h4>
        <div class="photo-grid">
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=900&q=80" alt="Blue domes in Santorini" /></div>
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1613395877344-13d4a8e0d49e?auto=format&fit=crop&w=900&q=80" alt="Greek island view" /></div>
          <div class="photo-item"><img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" alt="Coastal Greece scenery" /></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2024 Yolande's Travel Photos. All rights reserved.</p>
  </footer>

  <button id="backToTop" aria-label="Back to top"><i class="fas fa-chevron-up"></i></button>
  <script src="script.js"></script>
</body>
</html>
